<!DOCTYPE html>
<html>
<head><title>Game</title>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
</head>
<body>
	<a href="market/search.html">Browse More</a> | <a href="market/market.html">Marketplace</a> | <a href="library/library.html">Library</a> |
	<a href="forum/forum.html">Discussion Forum</a> | <a href="profile.html">My Profile</a>
	<h1> 
	</h1>
	<img src="" alt="cover" id="gameImg">
	<p id="gameDev">Developer: </p>
	<p id="gamePub">Publisher: </p>
	<p id="gameReleased">Released: </p> 
	<p id="gameRating">Metacritic: </p>
	<br>
	<br>
	<h2>Prices</h2>
	<table border="1" id="pricesTable">
di		<tr><th>Store</th><th>Sale</th><th>Normal</th><th></th></tr>
	<!--one row per store from game_prices tables-->
	</table>

	<h2>Add To Your Library</h2>
	<form method="post">
		<select name="status">
			<option value="plans">Plan on playing</option>
			<option value="inprogress">Playing</option>
			<option value="completed">Completed</option>
			<option value="removed">Removed</option>
		</select>
		<button id="addGame">Add</button>
	</form>

	<h2>Watch Price</h2>
	<form method="post">
		<input type="number" name="target_price" step="0.01" placeholder="Target Price">
		<button>Watch</button>
	</form>

	<br>
	<h2>Reviews</h2>
	<!--this will be where reviews from reviews table go-->
	<form method="post" id="review">
		<select name="rating" id="rating">
			<option>5</option><option>4</option><option>3</option><option>2</option><option>1</option>
		</select>
		<br>
		<textarea name="body" id="body" placeholder="Your review"></textarea>
		<br>
		<button>Submit Review</button>
	</form>
</body>	
</html>
<script src="gamePage.js" defer></script>
